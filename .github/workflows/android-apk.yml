
name: Build Nordland APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode laden
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Android-Projekt entpacken
        run: unzip Nordland-SPK-Android-Projekt.zip -d android-project

      - name: APK bauen
        working-directory: android-project
        run: gradle assembleDebug

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Nordland-SPK-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
